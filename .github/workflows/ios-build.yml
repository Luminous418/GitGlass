name: Build iOS Luminous

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar en simulador
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Seleccionar Xcode 26
        run: |
          XCODE_PATH=$(ls /Applications | grep -E '^Xcode_2[6-9]' | sort | tail -1)
          echo "Usando $XCODE_PATH"
          sudo xcode-select -s "/Applications/$XCODE_PATH"

      - name: Listar schemes
        run: xcodebuild -list -project Luminous.xcodeproj

      - name: Compilar para simulador
        run: |
          xcodebuild \
            -project Luminous.xcodeproj \
            -scheme Luminous \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Subir app como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GitGlass-simulator
          path: build/Build/Products/Debug-iphonesimulator/GitGlass.app
          if-no-files-found: error

  release:
    name: Archivo y firma (opcional)
    runs-on: macos-15
    needs: build
    if: github.ref == 'refs/heads/main' && vars.ENABLE_SIGNED_RELEASE == 'true'

    env:
      CERTIFICATE_NAME: ${{ secrets.CERTIFICATE_NAME }}
      PROFILE_UUID: ${{ secrets.PROFILE_UUID }}
      CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
      BUNDLE_ID: app.nance5816.meteor1654

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Seleccionar Xcode 26
        run: |
          XCODE_PATH=$(ls /Applications | grep -E '^Xcode_2[6-9]' | sort | tail -1)
          echo "Usando $XCODE_PATH"
          sudo xcode-select -s "/Applications/$XCODE_PATH"

      - name: Crear keychain temporal e instalar certificado
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$APPLE_CERT_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Instalar perfil de provisionamiento
        if: env.PROFILE_UUID != ''
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/${{ secrets.PROFILE_UUID }}.mobileprovision

      - name: Archivar app
        run: |
          xcodebuild \
            -project Luminous.xcodeproj \
            -scheme Luminous \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Luminous.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            archive

      - name: Exportar IPA
        env:
          PROFILE_UUID: ${{ secrets.PROFILE_UUID }}
          BUNDLE_ID: app.nance5816.meteor1654
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath build/Luminous.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: GitGlass-release
          path: build/ipa/GitGlass.ipa
          if-no-files-found: error
